[project]
name = "hmi-mes"
version = "0.1.0"
description = "Local Python foundation for the HMI-MES API, gateway, and simulator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "asyncua==2.1.0",
    "cryptography==50.0.2",
    "fastapi==0.152.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "sqlalchemy==2.1.5",
    "uvicorn==0.38.0",
    "websockets==15.0.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "playwright==1.56.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]
