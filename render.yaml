# Review the plan/disk charges in Render before creating this service.
# Persistent SQLite and OPC certificates require a paid persistent disk.
services:
  - type: web
    name: hmi-mes-plant
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./deploy/plant-service.Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    disk:
      name: hmi-mes-plant-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HMI_PUBLIC_API_URL
        value: https://hmi-mes.vercel.app
      - key: HMI_PLANT_ALLOW_INITIALIZE
        value: "true"
      - key: HMI_GATEWAY_TOKEN
        sync: false
